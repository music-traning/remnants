<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 深淵の背景 -->
  <rect width="16" height="16" fill="#000000" />
  
  <!-- 記憶の欠片（モノリス） -->
  <polygon points="8,2 14,8 8,14 2,8" fill="#1a202c" />
  <polygon points="8,3 13,8 8,13 3,8" fill="#2d3748" />
  
  <!-- 業（カルマ）と監視の赤い瞳 -->
  <rect x="6" y="7" width="4" height="2" fill="#c53030" />
  <rect x="7" y="6" width="2" height="4" fill="#c53030" />
  <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
  
  <!-- PoC（AI）を匂わせる緑のデジタルノイズ -->
  <rect x="4" y="4" width="1" height="1" fill="#48bb78" />
  <rect x="11" y="11" width="1" height="1" fill="#48bb78" />
  <rect x="3" y="9" width="1" height="1" fill="#48bb78" />
  <rect x="12" y="5" width="1" height="1" fill="#48bb78" />
</svg>